name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clonar J2ME-Loader
        run: git clone --depth 1 --recurse-submodules https://github.com/nikita36078/J2ME-Loader.git emu

      - name: Incluir el juego
        run: |
          mkdir -p emu/app/src/main/assets/game
          JAR=$(find . -path ./emu -prune -o -name "*.jar" -print | head -n 1)
          echo "Usando: $JAR"
          if [ -z "$JAR" ]; then echo "ERROR: no hay ningun .jar en el repo"; exit 1; fi
          cp "$JAR" emu/app/src/main/assets/game/
          mkdir -p out
          cp "$JAR" out/tom_and_jerry_mouse_maze.jar

      - name: Compilar APK
        working-directory: emu
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Reunir APK
        run: |
          find emu/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Subir APK y JAR
        uses: actions/upload-artifact@v4
        with:
          name: TomAndJerry-APK
          path: out/*
