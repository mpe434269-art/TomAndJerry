name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Clonar J2ME-Loader
        run: git clone --depth 1 --recurse-submodules https://github.com/nikita36078/J2ME-Loader.git emu

      - name: Incluir el juego
        run: |
          JAR=$(find . -path ./emu -prune -o -name "*.jar" -print | head -n 1)
          echo "Usando: $JAR"
          mkdir -p emu/app/src/main/assets/game out
          cp "$JAR" emu/app/src/main/assets/game/game.jar
          cp "$JAR" out/tom_and_jerry_mouse_maze.jar

      - name: Compilar APK
        working-directory: emu
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Reunir APK
        run: |
          find emu/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TomAndJerry-APK
          path: out/*
