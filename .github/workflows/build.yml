name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clonar J2ME-Loader
        run: git clone --depth 1 --recurse-submodules https://github.com/nikita36078/J2ME-Loader.git emu

      - name: Incluir el juego
        run: |
          JAR=$(find . -path ./emu -prune -o -name "*.jar" -print | head -n 1)
          echo "Usando: $JAR"
          if [ -z "$JAR" ]; then echo "ERROR: no hay ningun .jar en el repo"; exit 1; fi
          mkdir -p emu/app/src/main/assets/game out
          cp "$JAR" emu/app/src/main/assets/game/game.jar
          cp "$JAR" out/tom_and_jerry_mouse_maze.jar

      - name: Nombre de la app (opcional)
        continue-on-error: true
        run: |
          grep -rl 'name="app_
