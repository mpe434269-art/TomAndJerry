name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clonar J2ME-Loader
        run: git clone --depth 1 --recurse-submodules https://github.com/nikita36078/J2ME-Loader.git emu

      - name: Incluir el juego
        run: |
          mkdir -p emu/app/src/main/assets/game
          cp game/tom_and_jerry_mouse_maze.jar emu/app/src/main/assets/game/

      - name: Compilar APK
        working-directory: emu
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Reunir APK
        run: |
          mkdir -p out
          find emu/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: TomAndJerry-APK
          path: |
            out/*.apk
            game/tom_and_jerry_mouse_maze.jar
